name: Publish snapshot to Maven Central
on:
  push:
    branches:
      - main

# A newer push replaces the snapshot anyway, so an older run does not have to finish.
concurrency:
  group: snapshot
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        name: Checkout repository
        with:
          # The snapshot version is derived from the latest release tag.
          fetch-depth: 0
      - uses: actions/setup-java@v5
        name: Setup Java
        with:
          java-version: '26'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Determine snapshot version
        run: |
          # Next minor version after the latest release, e.g. v0.7.0 -> 0.8.0-SNAPSHOT.
          latest=$(git tag --list 'v*.*.*' --sort=-version:refname | head -n 1)
          if [ -z "$latest" ]; then
            echo "No release tag found" >&2
            exit 1
          fi
          IFS=. read -r major minor _ <<< "${latest#v}"
          echo "VERSION=$major.$((minor + 1)).0-SNAPSHOT" >> "$GITHUB_ENV"

      - name: Publish snapshot
        run: ./gradlew publishToMavenCentral --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_KEY_CONTENTS }}
